<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PW Player • Physics Wallah</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--surf:#121218;--card:#181820;--card2:#202028;
  --bdr:#282830;--bdr2:#303038;
  --acc:#7c6df0;--acc2:#a78bfa;--acc3:#5b4fd4;
  --txt:#eeeef5;--mut:#6a6a80;--mut2:#8a8aa0;
  --ok:#4ade80;--err:#f87171;--warn:#fbbf24;
}
*{-webkit-font-smoothing:antialiased}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}

.page{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:1}
.page.active{display:flex!important;z-index:10}
.page.base{display:flex!important;z-index:1}

@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page.active{animation:pgIn .22s ease}

.tb{background:var(--surf);border-bottom:1px solid var(--bdr);padding:13px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:10px;flex:1}
.bk{width:36px;height:36px;background:var(--card);border:1px solid var(--bdr2);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mut2)}
.bk:active{background:var(--acc);color:#fff}
.tb-title{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:36px;height:36px;border-radius:50%;border:2px solid var(--acc);cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;justify-content:center}

.sc{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px}
.sc::-webkit-scrollbar{display:none}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--bdr);display:flex;z-index:20}
.bnt{flex:1;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:transparent;color:var(--mut);font-size:10px;font-weight:600;border:none}
.bnt.on{color:var(--acc)}

/* LOGIN */
#pgLogin{z-index:50;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse 100% 60% at 10% 0%,rgba(124,109,240,.2) 0%,transparent 50%),var(--bg)}
.lb{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:28px}
.blogo{width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;color:#fff;box-shadow:0 16px 48px rgba(124,109,240,.45)}
.brand h1{font-size:26px;font-weight:800}
.brand h1 span{color:var(--acc2)}
.login-hint{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:12px;padding:11px 14px;margin-bottom:16px;display:flex;gap:10px}
.login-hint p{font-size:12px;color:var(--mut2)}
.lcard{background:var(--surf);border:1px solid var(--bdr2);border-radius:22px;padding:22px}
.ig{margin-bottom:14px}
.ig label{display:block;font-size:10px;color:var(--mut2);margin-bottom:6px;text-transform:uppercase;font-weight:700}
.ig input{width:100%;background:var(--card);border:1.5px solid var(--bdr2);border-radius:12px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none}
.otp-row{display:flex;gap:8px}
.otp-row .ig{flex:1}
.otp-btn{background:var(--card);border:1.5px solid var(--bdr2);border-radius:12px;padding:0 16px;color:var(--acc2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.lbtn{width:100%;padding:15px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:13px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px}
.emsg{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:10px 13px;color:var(--err);font-size:13px;margin-top:10px;display:none}
.emsg.on{display:block}

/* CARDS */
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer;position:relative}
.cc:active{border-color:var(--acc)}
.cimg{width:100%;height:120px;object-fit:cover}
.cph{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:40px}
.cbody{padding:12px 14px;display:flex;align-items:center;gap:10px}
.cnm{font-weight:700;font-size:13px}
.cmeta{font-size:11px;color:var(--mut2)}
.fav-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:none;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.fav-btn.active svg{stroke:var(--err);fill:var(--err)}

/* ROW */
.rc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.rnum{width:36px;height:36px;border-radius:10px;background:rgba(124,109,240,.1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--acc2)}
.rimgph{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.rtxt{flex:1}
.rnm{font-weight:700;font-size:14px}
.rsub{font-size:11px;color:var(--mut2)}

/* VIDEO */
.vc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;display:flex;gap:10px}
.vthph{width:90px;height:60px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px}
.vnm{font-size:13px;font-weight:600}

/* PLAYER */
#pgPlayer{background:#000}
.player-tb{background:rgba(0,0,0,.9);padding:11px 14px;display:flex;align-items:center;gap:10px}
#vplayer{width:100%;display:block;max-height:260px;background:#000}
.player-info{padding:14px 16px;background:var(--bg)}
.player-title{font-weight:700;font-size:15px}
.player-acts{display:flex;gap:8px;margin-top:14px}
.pact{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bdr2);background:var(--card);color:var(--txt);font-size:11px;font-weight:600;cursor:pointer}
.pact.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}

/* PDF */
.pdf-panel{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.pdf-panel.hidden{display:none}
.pdf-topbar{display:flex;padding:10px 14px;background:var(--surf);gap:8px}
.pdftab{flex:1;padding:8px;border:1px solid var(--bdr2);border-radius:9px;background:var(--card);color:var(--mut2);font-size:12px;font-weight:600;cursor:pointer}
.pdftab.on{background:var(--acc);color:#fff}
.pdf-frame-wrap{flex:1}
.pdf-frame-wrap iframe{width:100%;height:100%;border:none;background:#fff}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--surf);border-radius:24px 24px 0 0;width:100%;max-width:480px;animation:sheetUp .28s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhead{padding:16px 20px 10px}
.mtitle{font-weight:700;font-size:15px}
.mbody{padding:0 20px 20px}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtn{background:var(--card);border:1px solid var(--bdr2);border-radius:11px;padding:10px 18px;color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
.mcancel{width:100%;margin-top:8px;padding:13px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;color:var(--mut2);font-size:13px;cursor:pointer}

/* UTILS */
.sw{display:flex;gap:8px;margin-bottom:14px}
.si{flex:1;background:var(--card);border:1.5px solid var(--bdr2);border-radius:12px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none}
.sh{font-weight:700;font-size:10px;color:var(--mut2);text-transform:uppercase;margin:14px 0 10px}
.empty{text-align:center;padding:48px 20px}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--bdr) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:14px;height:70px;margin-bottom:10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bdr2);border-radius:12px;padding:11px 18px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.lpill{display:flex;align-items:center;gap:10px;background:rgba(255,107,53,.07);border:1px solid rgba(255,107,53,.2);border-radius:13px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.ldot{width:8px;height:8px;background:#ff6b35;border-radius:50%;animation:pulse 1.4s infinite}
.ltxt{font-weight:700;font-size:13px;color:#ff6b35}

/* SHEET */
.sheet-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end}
.sheet-box{width:100%;background:var(--surf);border-radius:24px 24px 0 0;padding:20px}
.sheet-handle{width:40px;height:4px;background:var(--bdr2);border-radius:2px;margin:0 auto 20px}

@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="page" id="pgLogin">
<div class="lb">
  <div class="brand">
    <div class="blogo">PW</div>
    <h1>Physics <span>Wallah</span></h1>
    <p>Delta Verse Gateway</p>
  </div>
  <div class="login-hint">
    <p><strong>Use your registered mobile number.</strong> OTP will be sent via secure gateway.</p>
  </div>
  <div class="lcard">
    <div class="ig">
      <label>Mobile Number</label>
      <input type="tel" id="mobileInput" placeholder="10-digit mobile number" maxlength="10">
    </div>
    <div class="otp-row">
      <div class="ig">
        <label>OTP</label>
        <input type="text" id="otpInput" placeholder="4-digit OTP" maxlength="4">
      </div>
      <button class="otp-btn" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
    </div>
    <button class="lbtn" id="loginBtn" onclick="verifyOTP()"><span id="loginBtnText">Verify & Login</span></button>
    <div class="emsg" id="loginError"></div>
  </div>
</div>
</div>

<!-- HOME -->
<div class="page base" id="pgHome">
  <div class="tb">
    <div class="tb-title">Physics Wallah</div>
    <div class="ava" id="avabtn" onclick="gotoSheet()">P</div>
  </div>
  <div id="t0" class="sc">
    <div class="sh">All Batches</div>
    <div id="g0"></div>
  </div>
  <div id="t1" class="sc" style="display:none">
    <div class="sh">Saved Batches</div>
    <div id="g1"></div>
  </div>
  <div id="t2" class="sc" style="display:none">
    <div class="sh">Profile</div>
    <button onclick="logout()" style="width:100%;padding:13px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);border-radius:13px;color:var(--err);font-weight:600;cursor:pointer">Logout</button>
  </div>
  <nav class="bnav">
    <button class="bnt on" id="bn0" onclick="swtab(0)">📚 Batches</button>
    <button class="bnt" id="bn1" onclick="swtab(1)">❤️ Saved</button>
    <button class="bnt" id="bn2" onclick="swtab(2)">👤 Profile</button>
  </nav>
</div>

<!-- SUBJECTS -->
<div class="page" id="pgSubj">
  <div class="tb">
    <div class="tb-l">
      <div class="bk" onclick="back('pgHome')">←</div>
      <div class="tb-title" id="stitle">Subjects</div>
    </div>
  </div>
  <div class="sc">
    <div class="lpill" onclick="goLive()"><div class="ldot"></div><span class="ltxt">Live Classes</span></div>
    <div class="sh">All Subjects</div>
    <div id="gs"></div>
  </div>
</div>

<!-- TOPICS -->
<div class="page" id="pgTopic">
  <div class="tb">
    <div class="tb-l">
      <div class="bk" onclick="back('pgSubj')">←</div>
      <div class="tb-title" id="ttitle">Topics</div>
    </div>
  </div>
  <div class="sc"><div id="gt"></div></div>
</div>

<!-- CONTENT -->
<div class="page" id="pgContent">
  <div class="tb">
    <div class="tb-l">
      <div class="bk" onclick="back('pgTopic')">←</div>
      <div class="tb-title" id="ctitle">Content</div>
    </div>
  </div>
  <div class="sc" style="padding:0">
    <div style="display:flex;padding:10px 14px;gap:8px;background:var(--surf)">
      <button class="pdftab on" id="tabVideos" onclick="switchContentTab('videos')">Videos</button>
      <button class="pdftab" id="tabNotes" onclick="switchContentTab('notes')">Notes</button>
    </div>
    <div style="padding:14px"><div id="gcontent"></div></div>
  </div>
</div>

<!-- PLAYER -->
<div class="page" id="pgPlayer">
  <div class="player-tb">
    <div class="bk" onclick="closePlayer()">←</div>
    <div class="tb-title" style="color:#fff" id="ptbar">Video</div>
  </div>
  <div style="background:#000"><video id="vplayer" controls playsinline></video></div>
  <div class="player-info">
    <div class="player-title" id="ptitle">Loading...</div>
    <div class="player-acts">
      <button class="pact pri" onclick="showQPicker()">Quality</button>
      <button class="pact" id="pbPdf" onclick="openPdf()" disabled>PDF</button>
    </div>
  </div>
  <div class="pdf-panel hidden" id="pdfPanel">
    <div class="pdf-topbar">
      <span style="font-size:12px;font-weight:600">PDF Viewer</span>
      <div class="bk" onclick="closePdfPanel()" style="margin-left:auto">✕</div>
    </div>
    <div class="pdf-frame-wrap"><iframe id="pdfFrame"></iframe></div>
  </div>
</div>

<!-- LIVE -->
<div class="page" id="pgLive">
  <div class="tb">
    <div class="tb-l">
      <div class="bk" onclick="back('pgSubj')">←</div>
      <div class="tb-title">Live Classes</div>
    </div>
  </div>
  <div class="sc"><div id="gl"></div></div>
</div>

<!-- SHEET -->
<div class="sheet-ov" id="sheetOv" onclick="closeSheet(event)">
  <div class="sheet-box">
    <div class="sheet-handle"></div>
    <div style="display:flex;align-items:center;gap:13px;margin-bottom:18px">
      <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff">P</div>
      <div><div style="font-weight:700">Student</div><div id="smobile" style="font-size:12px;color:var(--mut2)">—</div></div>
    </div>
    <button onclick="logout()" style="width:100%;padding:13px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);border-radius:12px;color:var(--err);font-weight:600;cursor:pointer">Logout</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const GATEWAY = '/api/gateway';
const STREAM_PROXY = '/api/proxy?url=';

// ===== STATE =====
const W = {
  token: localStorage.getItem('dv_token') || null,
  mobile: localStorage.getItem('dv_mobile') || '',
  batches: [],
  currentBatch: null,
  currentSubject: null,
  currentTopic: null,
  currentContentType: 'videos',
  currentVideo: null,
  pdfUrl: null,
};

let hls = null;
let toastTimer = null;

// ===== HELPERS =====
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ===== API CALLS =====
async function gw(path, options = {}) {
  const url = `${GATEWAY}${path}`;
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if(W.token) headers['Authorization'] = `Bearer ${W.token}`;
  
  const res = await fetch(url, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  
  if(res.status === 401) {
    localStorage.clear();
    W.token = null;
    show('pgLogin');
    toast('Session expired');
    return { success: false };
  }
  
  return res.json();
}

// ===== AUTH =====
async function sendOTP() {
  const mobile = document.getElementById('mobileInput').value.trim();
  if(mobile.length !== 10) {
    document.getElementById('loginError').classList.add('on');
    document.getElementById('loginError').textContent = 'Enter 10-digit mobile';
    return;
  }
  
  const btn = document.getElementById('sendOtpBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  
  const res = await fetch(`${GATEWAY}/api/v2/user/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phoneNumber: mobile })
  });
  
  const data = await res.json();
  
  if(data.success) {
    toast('OTP sent!');
    let cd = 30;
    const t = setInterval(() => { cd--; btn.textContent = `Resend (${cd}s)`; if(cd<=0) { clearInterval(t); btn.disabled = false; btn.textContent = 'Send OTP'; } }, 1000);
  } else {
    document.getElementById('loginError').classList.add('on');
    document.getElementById('loginError').textContent = data.message || 'Failed';
    btn.disabled = false; btn.textContent = 'Send OTP';
  }
}

async function verifyOTP() {
  const mobile = document.getElementById('mobileInput').value.trim();
  const otp = document.getElementById('otpInput').value.trim();
  
  if(mobile.length !== 10 || otp.length !== 4) {
    document.getElementById('loginError').classList.add('on');
    document.getElementById('loginError').textContent = 'Enter valid mobile and 4-digit OTP';
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  document.getElementById('loginBtnText').textContent = 'Verifying...';
  
  const res = await fetch(`${GATEWAY}/api/v2/user/verify-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phoneNumber: mobile, otp })
  });
  
  const data = await res.json();
  
  if(data.success && data.token) {
    W.token = data.token;
    W.mobile = mobile;
    localStorage.setItem('dv_token', W.token);
    localStorage.setItem('dv_mobile', mobile);
    goHome();
  } else {
    document.getElementById('loginError').classList.add('on');
    document.getElementById('loginError').textContent = data.message || 'Invalid OTP';
    btn.disabled = false;
    document.getElementById('loginBtnText').textContent = 'Verify & Login';
  }
}

// ===== BATCHES =====
async function loadBatches() {
  const g = document.getElementById('g0');
  g.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  
  const data = await gw('/api/v2/BatchInfo?type=details&page=1');
  
  if(data.success && data.data) {
    W.batches = data.data;
    const favs = JSON.parse(localStorage.getItem('dv_favs')||'{}');
    g.innerHTML = data.data.map(b => {
      const isFav = !!favs[b._id];
      return `<div class="cc" onclick="openSubjects('${b._id}','${esc(b.name)}')">
        ${b.previewImage ? `<img class="cimg" src="${esc(b.previewImage)}">` : '<div class="cph">📚</div>'}
        <button class="fav-btn ${isFav?'active':''}" onclick="event.stopPropagation();toggleFav('${b._id}','${esc(b.name)}',this)">❤️</button>
        <div class="cbody"><div class="cnm">${esc(b.name)}</div><div class="cmeta">${esc(b.byName||'')}</div></div>
      </div>`;
    }).join('');
  } else {
    g.innerHTML = '<div class="empty"><h3>No Batches</h3></div>';
  }
}

function toggleFav(id, name, btn) {
  const favs = JSON.parse(localStorage.getItem('dv_favs')||'{}');
  if(favs[id]) { delete favs[id]; btn.classList.remove('active'); } else { favs[id] = {id, name}; btn.classList.add('active'); }
  localStorage.setItem('dv_favs', JSON.stringify(favs));
  if(W.tab === 1) loadFavs();
}

function loadFavs() {
  const favs = Object.values(JSON.parse(localStorage.getItem('dv_favs')||'{}'));
  const g = document.getElementById('g1');
  if(!favs.length) { g.innerHTML = '<div class="empty"><h3>No Saved</h3></div>'; return; }
  g.innerHTML = favs.map(b => `<div class="cc" onclick="openSubjects('${b.id}','${esc(b.name)}')"><div class="cph">📚</div><div class="cbody"><div class="cnm">${esc(b.name)}</div></div></div>`).join('');
}

// ===== SUBJECTS =====
async function openSubjects(batchId, batchName) {
  W.currentBatch = { id: batchId, name: batchName };
  document.getElementById('stitle').textContent = batchName;
  show('pgSubj');
  const g = document.getElementById('gs');
  g.innerHTML = '<div class="skel"></div>';
  
  const data = await gw(`/api/v2/BatchInfo?batchId=${batchId}&type=details`);
  
  if(data.success && data.data?.subjects) {
    g.innerHTML = data.data.subjects.map((s,i) => `<div class="rc" onclick="openTopics('${s._id}','${esc(s.name||s.subject)}')">
      <div class="rimgph">${['📗','📘','📙','📕'][i%4]}</div>
      <div class="rtxt"><div class="rnm">${esc(s.name||s.subject)}</div><div class="rsub">Tap to view topics</div></div>
    </div>`).join('');
  } else {
    g.innerHTML = '<div class="empty"><h3>No Subjects</h3></div>';
  }
}

// ===== TOPICS =====
async function openTopics(subjectId, subjectName) {
  W.currentSubject = { id: subjectId, name: subjectName };
  document.getElementById('ttitle').textContent = subjectName;
  show('pgTopic');
  const g = document.getElementById('gt');
  g.innerHTML = '<div class="skel"></div>';
  
  const data = await gw(`/api/v2/SubjectInfo?batchId=${W.currentBatch.id}&subjectId=${subjectId}&page=1`);
  
  if(data.success && data.data) {
    g.innerHTML = data.data.map((t,i) => `<div class="rc" onclick="openContent('${t._id}','${esc(t.name)}')">
      <div class="rnum">${String(i+1).padStart(2,'0')}</div>
      <div class="rtxt"><div class="rnm">${esc(t.name)}</div></div>
    </div>`).join('');
  } else {
    g.innerHTML = '<div class="empty"><h3>No Topics</h3></div>';
  }
}

// ===== CONTENT =====
async function openContent(topicId, topicName) {
  W.currentTopic = { id: topicId, name: topicName };
  document.getElementById('ctitle').textContent = topicName;
  W.currentContentType = 'videos';
  show('pgContent');
  loadContent();
}

async function loadContent() {
  const g = document.getElementById('gcontent');
  g.innerHTML = '<div class="skel"></div>';
  
  const data = await gw(`/api/v2/TopicContent?batchId=${W.currentBatch.id}&subjectId=${W.currentSubject.id}&topicId=${W.currentTopic.id}&contentType=${W.currentContentType}&page=1`);
  
  if(data.success && data.data) {
    if(W.currentContentType === 'videos') {
      g.innerHTML = data.data.map(v => `<div class="vc" onclick="openVideo('${v._id}','${esc(v.title||v.name)}')">
        <div class="vthph">▶️</div>
        <div class="vnm">${esc(v.title||v.name)}</div>
      </div>`).join('');
    } else {
      g.innerHTML = data.data.map(n => `<div class="rc" onclick="openPdfViewer('${n.pdfId||n._id}','${esc(n.title||n.name)}')">
        <div class="rnum">📄</div>
        <div class="rtxt"><div class="rnm">${esc(n.title||n.name)}</div></div>
      </div>`).join('');
    }
  } else {
    g.innerHTML = '<div class="empty"><h3>No Content</h3></div>';
  }
}

function switchContentTab(type) {
  W.currentContentType = type;
  document.getElementById('tabVideos').classList.toggle('on', type==='videos');
  document.getElementById('tabNotes').classList.toggle('on', type==='notes');
  loadContent();
}

// ===== VIDEO =====
async function openVideo(videoId, title) {
  const streamUrl = `${GATEWAY}/play/${W.currentBatch.id}/${W.currentSubject.id}/${videoId}/master.m3u8`;
  W.currentVideo = { url: streamUrl, title, videoId };
  playVideoDirect(streamUrl, title);
}

function playVideoDirect(url, title) {
  show('pgPlayer');
  document.getElementById('ptbar').textContent = title;
  document.getElementById('ptitle').textContent = title;
  document.getElementById('pbPdf').disabled = !W.pdfUrl;
  
  const v = document.getElementById('vplayer');
  if(hls) { hls.destroy(); hls = null; }
  v.pause(); v.src = '';
  
  const finalUrl = url.includes('master.m3u8') ? url : `${STREAM_PROXY}${encodeURIComponent(url)}`;
  
  if(Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(finalUrl);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
  } else {
    v.src = finalUrl;
    v.play().catch(()=>{});
  }
}

function showQPicker() { if(W.currentVideo) playVideoDirect(W.currentVideo.url, W.currentVideo.title); }

// ===== PDF =====
async function openPdfViewer(pdfId, title) {
  const data = await gw(`/api/v2/GetPdf?batchId=${W.currentBatch.id}&subjectId=${W.currentSubject.id}&pdfId=${pdfId}`);
  if(data.success && data.url) {
    W.pdfUrl = data.url;
    openPdf();
  } else {
    toast('PDF not available');
  }
}

function openPdf() {
  if(!W.pdfUrl) return;
  document.getElementById('pdfPanel').classList.remove('hidden');
  document.getElementById('pdfFrame').src = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(W.pdfUrl)}`;
}

function closePdfPanel() { document.getElementById('pdfPanel').classList.add('hidden'); }

// ===== LIVE =====
async function goLive() {
  if(!W.currentBatch) { toast('Select a batch first'); return; }
  show('pgLive');
  const g = document.getElementById('gl');
  g.innerHTML = '<div class="skel"></div>';
  
  const data = await gw(`/api/v2/TodaySchedule?batchId=${W.currentBatch.id}`);
  
  if(data.success && data.data) {
    g.innerHTML = data.data.map(s => `<div class="cc" onclick="playLive('${s.contentId}','${esc(s.topic||s.title)}')">
      <div class="cph">${s.status==='live'?'🔴':'⏰'}</div>
      <div class="cbody"><div class="cnm">${esc(s.topic||s.title)}</div><div class="cmeta">${s.status||''} • ${esc(s.startTime||'')}</div></div>
    </div>`).join('');
  } else {
    g.innerHTML = '<div class="empty"><h3>No Live Classes</h3></div>';
  }
}

async function playLive(contentId, title) {
  const streamUrl = `${GATEWAY}/play/${W.currentBatch.id}/${W.currentSubject?.id||'live'}/${contentId}/master.m3u8`;
  W.currentVideo = { url: streamUrl, title };
  playVideoDirect(streamUrl, title);
}

// ===== NAVIGATION =====
function show(id) {
  document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
  const t = document.getElementById(id);
  if(t) { t.style.display = 'flex'; t.classList.add('active'); }
}

function back(to) { show(to); }
function closePlayer() {
  if(hls) { hls.destroy(); hls = null; }
  document.getElementById('vplayer').pause();
  closePdfPanel();
  back('pgContent');
}

function swtab(n) {
  W.tab = n;
  ['bn0','bn1','bn2'].forEach((id,i) => document.getElementById(id)?.classList.toggle('on', i===n));
  ['t0','t1','t2'].forEach((id,i) => { const e = document.getElementById(id); if(e) e.style.display = i===n ? 'block' : 'none'; });
  if(n===1) loadFavs();
}

function logout() {
  localStorage.clear();
  W.token = null;
  show('pgLogin');
  toast('Logged out');
}

function gotoSheet() { document.getElementById('sheetOv').style.display = 'flex'; }
function closeSheet(e) { if(e.target === document.getElementById('sheetOv')) document.getElementById('sheetOv').style.display = 'none'; }

// ===== INIT =====
window.onload = () => {
  if(W.token) { show('pgHome'); swtab(0); loadBatches(); document.getElementById('smobile').textContent = W.mobile; }
  else show('pgLogin');
};
</script>
